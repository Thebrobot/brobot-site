name: Scheduled Daily Deploy

on:
  schedule:
    # Run daily at 11:00 UTC (6:00 AM Eastern)
    - cron: '0 11 * * *'
  workflow_dispatch:
    # Allow manual trigger from Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          BUILD_HOOK_URL: ${{ secrets.BUILD_HOOK_URL }}
        run: |
          if [ -z "$BUILD_HOOK_URL" ]; then
            echo "::error::BUILD_HOOK_URL secret is not set. Add it in repo Settings > Secrets."
            exit 1
          fi
          curl -X POST -f -d "" "$BUILD_HOOK_URL" || exit 1
